name: Phase 1 Broker CI

on:
  push:
    branches: [main, phase1-broker-*]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  phase1-broker-validation:
    name: Phase 1 Broker Model Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── Canonical pattern checks (fail-closed) ─────────────────────────────

      - name: Check — no BrokerCase references in contracts
        run: |
          if grep -r "BrokerCase" src/lib/contracts/ src/functions/; then
            echo "FAIL: Stale BrokerCase references found"
            exit 1
          fi
          echo "PASS: No BrokerCase references"

      - name: Check — no BrokerEmployer references in contracts
        run: |
          if grep -r "BrokerEmployer" src/lib/contracts/ src/functions/; then
            echo "FAIL: Stale BrokerEmployer references found"
            exit 1
          fi
          echo "PASS: No BrokerEmployer references"

      - name: Check — no relationship.relationship_status usage in contracts
        run: |
          if grep -r "relationship\.relationship_status" src/lib/contracts/ src/functions/; then
            echo "FAIL: Stale relationship.relationship_status field found"
            exit 1
          fi
          echo "PASS: No relationship.relationship_status usage"

      - name: Check — canonical AuditEvent fields present (event_type, actor_id, event_detail)
        run: |
          FAIL=0
          if ! grep -q "event_type" src/lib/contracts/brokerWorkspaceContract.js; then
            echo "FAIL: event_type not found in brokerWorkspaceContract.js"
            FAIL=1
          fi
          if ! grep -q "actor_id" src/lib/contracts/brokerWorkspaceContract.js; then
            echo "FAIL: actor_id not found in brokerWorkspaceContract.js"
            FAIL=1
          fi
          if ! grep -q "event_detail" src/lib/contracts/brokerWorkspaceContract.js; then
            echo "FAIL: event_detail not found in brokerWorkspaceContract.js"
            FAIL=1
          fi
          if [ "$FAIL" -eq 1 ]; then exit 1; fi
          echo "PASS: Canonical AuditEvent fields verified"

      - name: Check — duplicate signup detection exists
        run: |
          if ! grep -q "runDuplicateBrokerDetection\|duplicate_detection\|duplicateDetection" src/lib/contracts/brokerSignupContract.js; then
            echo "FAIL: Duplicate signup detection not found in brokerSignupContract.js"
            exit 1
          fi
          echo "PASS: Duplicate signup detection present"

      # ── Test scripts ────────────────────────────────────────────────────────

      - name: Run validate:phase1-broker-model
        run: npm run validate:phase1-broker-model

      - name: Run qa:phase1
        run: npm run qa:phase1
        env:
          CI: true

      # ── Artifact upload (always runs) ───────────────────────────────────────

      - name: Collect CI evidence
        if: always()
        run: |
          mkdir -p ci-evidence
          echo "Phase 1 Broker CI Evidence" > ci-evidence/summary.txt
          echo "Run date: $(date -u)" >> ci-evidence/summary.txt
          echo "Commit: ${{ github.sha }}" >> ci-evidence/summary.txt
          echo "Branch: ${{ github.ref_name }}" >> ci-evidence/summary.txt
          echo "" >> ci-evidence/summary.txt
          echo "--- Contract file checksums ---" >> ci-evidence/summary.txt
          sha256sum src/lib/contracts/brokerWorkspaceContract.js >> ci-evidence/summary.txt || true
          sha256sum src/lib/contracts/brokerSignupContract.js >> ci-evidence/summary.txt || true
          sha256sum src/lib/contracts/brokerPortalAccessContract.js >> ci-evidence/summary.txt || true
          echo "" >> ci-evidence/summary.txt
          echo "--- Pattern scan results ---" >> ci-evidence/summary.txt
          echo "BrokerCase hits: $(grep -r 'BrokerCase' src/lib/contracts/ src/functions/ | wc -l)" >> ci-evidence/summary.txt
          echo "BrokerEmployer hits: $(grep -r 'BrokerEmployer' src/lib/contracts/ src/functions/ | wc -l)" >> ci-evidence/summary.txt
          echo "relationship_status hits: $(grep -r 'relationship\.relationship_status' src/lib/contracts/ src/functions/ | wc -l)" >> ci-evidence/summary.txt

      - name: Upload ci-evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence
          path: ci-evidence/
          retention-days: 30